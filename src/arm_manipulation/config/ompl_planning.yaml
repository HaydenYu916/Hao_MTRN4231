move_group:
  ros__parameters:
    planning_pipelines:
      pipeline_names: [ompl]
    default_planning_pipeline: ompl

    ompl:
      planning_plugin: ompl_interface/OMPLPlanner
      request_adapters: >-
        default_planner_request_adapters/FixWorkspaceBounds
        default_planner_request_adapters/FixStartStateBounds
        default_planner_request_adapters/FixStartStateCollision
        default_planner_request_adapters/FixStartStatePathConstraints
        default_planner_request_adapters/ResolveConstraintFrames
        default_planner_request_adapters/AddTimeOptimalParameterization
      start_state_max_bounds_error: 0.1

      # Planner configurations
      planner_configs:
        # Enabled planners
        # PRMstar - Probabilistic roadmap, very constraint-friendly
        PRMstarkConfigDefault:
          type: geometric::PRMstar
          max_nearest_neighbors: 10
          
        # RRTConnect - default fast planner
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.1
          
        # RRTstar - optional optimal planner
        RRTstarkConfigDefault:
          type: geometric::RRTstar
          range: 0.1

        # The following planners are disabled (remove if needed)
        # BITstarkConfigDefault:
        #   type: geometric::BITstar
        #   samples_per_batch: 100
        #   use_k_nearest: true
        #
        # KPIECEkConfigDefault:
        #   type: geometric::KPIECE1
        #   range: 0.0
        #   goal_bias: 0.05
        #   border_fraction: 0.9
        #
        # BKPIECEkConfigDefault:
        #   type: geometric::BKPIECE1
        #   range: 0.0
        #   border_fraction: 0.9
        #
        # ESTkConfigDefault:
        #   type: geometric::EST
        #   range: 0.0
        #   goal_bias: 0.05
        #
        # SBLkConfigDefault:
        #   type: geometric::SBL
        #   range: 0.0
        #
        # TRRTkConfigDefault:
        #   type: geometric::TRRT
        #   range: 0.0
